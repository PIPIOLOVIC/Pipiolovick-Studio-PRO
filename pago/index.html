<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pago seguro · Pipiolovick Studio</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0d14; color: #e2e8f0; font-family: system-ui, Segoe UI, sans-serif; text-align: center; padding: 16px; }
    .box { max-width: 420px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
  </style>
  <!-- Página "Default payment link" de Paddle: la app crea la compra (?_ptxn=txn_...) y aquí se abre el pago. -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>
  <div class="box">
    <h1 id="t">Abriendo el pago seguro…</h1>
    <p id="m">El pago lo procesa Paddle. Al terminar, vuelve a Pipiolovick Studio: tu plan se actualiza solo.</p>
  </div>
  <script>
    // Token público de cliente (no es secreto). Sandbox empieza con "test_", producción con "live_".
    var TOKEN = 'test_3cb70fd8586aea56f36cbc82e27';
    var txn = new URLSearchParams(location.search).get('_ptxn');
    if (TOKEN.indexOf('test_') === 0) Paddle.Environment.set('sandbox');
    Paddle.Initialize({
      token: TOKEN,
      eventCallback: function (e) {
        if (e.name === 'checkout.completed') {
          document.getElementById('t').textContent = '¡Pago completado!';
          document.getElementById('m').textContent = 'Ya puedes cerrar esta pestaña y volver a Pipiolovick Studio.';
        }
      }
    });
    if (!txn) {
      document.getElementById('t').textContent = 'Pipiolovick Studio';
      document.getElementById('m').textContent = 'Para mejorar tu plan, abre la app y toca "Mejorar plan".';
    }
  </script>
</body>
</html>
